<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TinyThreads | Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <h1 class="brand"><a href="index.html">TinyThreads</a></h1>
        <button
          class="nav-toggle"
          aria-controls="site-nav"
          aria-expanded="false"
          aria-label="Toggle menu"
        >
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
        <nav id="site-nav" class="nav" role="navigation">
          <a href="index.html">Home</a>
          <a href="collections.html">Collections</a>
          <a href="index.html#categories">Categories</a>
          <a href="index.html#contact" class="cta">Shop</a>
          <div class="nav-actions">
            <button
              id="cartButton"
              class="icon-btn"
              type="button"
              aria-label="Open cart"
            >
              <i class="bi bi-cart3 icon" aria-hidden="true"></i>
              <span class="badge" id="cartCount">0</span>
            </button>
            <button
              id="favoriteButton"
              class="icon-btn"
              type="button"
              aria-label="Open favorites"
            >
              <i class="bi bi-heart icon" aria-hidden="true"></i>
              <span class="badge" id="favoriteCount">0</span>
            </button>
            <div class="auth-dropdown">
              <button
                id="authButton"
                class="icon-btn"
                type="button"
                aria-label="Sign in"
                aria-haspopup="true"
                aria-expanded="false"
              >
                <span id="authLabel">Login</span>
                <i
                  class="bi bi-chevron-down dropdown-arrow hidden"
                  id="authChevron"
                  aria-hidden="true"
                ></i>
              </button>
              <div id="authMenu" class="auth-menu hidden">
                <button
                  type="button"
                  id="logoutNavButton"
                  class="auth-menu-item"
                >
                  Logout
                </button>
              </div>
            </div>
          </div>
        </nav>
      </div>
    </header>

    <main>
      <section class="container section detail-page">
        <div id="detailContent"></div>
      </section>
    </main>

    <div id="cartOverlay" class="cart-overlay hidden">
      <div id="cartBackdrop" class="cart-overlay-backdrop"></div>
      <div class="cart-card">
        <div class="cart-header">
          <div>
            <span class="eyebrow">Your cart</span>
            <h3>Shopping bag</h3>
          </div>
          <button
            class="btn btn-outline"
            type="button"
            id="closeCart"
            aria-label="Close cart"
          >
            <i class="bi bi-x-lg" aria-hidden="true"></i>
          </button>
        </div>
        <div id="cartItems" class="cart-items">
          <p class="empty-cart">Your cart is empty. Add something fun!</p>
        </div>
        <div class="cart-footer hidden" id="cartFooter">
          <div class="cart-total">
            <span>Total</span>
            <strong id="cartTotal">$0.00</strong>
          </div>
          <div class="cart-actions">
            <button class="btn btn-outline" type="button" id="deleteAllButton">
              Delete all
            </button>
            <button class="btn btn-primary" type="button" id="checkoutButton">
              Checkout
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="favoritesOverlay" class="favorites-overlay hidden">
      <div id="favoritesBackdrop" class="cart-overlay-backdrop"></div>
      <div class="favorites-card">
        <div class="cart-header">
          <div>
            <span class="eyebrow">Saved items</span>
            <h3>Favorites</h3>
          </div>
          <button
            class="btn btn-outline"
            type="button"
            id="closeFavorites"
            aria-label="Close favorites"
          >
            <i class="bi bi-x-lg" aria-hidden="true"></i>
          </button>
        </div>
        <div id="favoritesItems" class="cart-items">
          <p class="empty-cart">No favorites yet. Save an item you love.</p>
        </div>
      </div>
    </div>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>&copy; 2026 TinyThreads. Little outfits, big smiles.</p>
        <nav class="footer-nav">
          <a href="index.html#privacy">Privacy</a>
          <a href="index.html#terms">Terms</a>
        </nav>
      </div>
    </footer>

        <script src="assets/js/common.js"></script>
    <script src="assets/js/details.js"></script>
</body>
</html>
