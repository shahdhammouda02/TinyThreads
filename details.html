    <div id="cartOverlay" class="cart-overlay hidden">
      <div id="cartBackdrop" class="cart-overlay-backdrop"></div>
      <div class="cart-card">
        <div class="cart-header">
          <div>
            <span class="eyebrow">Your cart</span>

          </div>

            class="btn btn-outline"
            type="button"
            id="closeCart"

          </button>
        </div>
        <div id="cartItems" class="cart-items">

        </div>
        <div class="cart-footer hidden" id="cartFooter">
          <div class="cart-total">
            <span>Total</span>
            <strong id="cartTotal">$0.00</strong>
          </div>
          <div class="cart-actions">
            <button class="btn btn-outline" type="button" id="deleteAllButton">
              Delete all
            </button>
            <button class="btn btn-primary" type="button" id="checkoutButton">
              Checkout
            </button>
          </div>
        </div>
      </div>
    </div>

        </div>

          <p class="empty-cart">No favorites yet. Save an item you love.</p>
        </div>
      </div>
    </div>

      // Small accessibility: focus outline for keyboard users
      (function () {
        window.addEventListener(
          "keydown",
          function (e) {
            if (e.key === "Tab")
              document.documentElement.classList.add("keyboard");
          },
          { once: true },
        );
      })();

      // Mobile nav toggle
      (function () {
        const toggle = document.querySelector(".nav-toggle");
        const nav = document.getElementById("site-nav");
        if (!toggle || !nav) return;

        function setOpen(isOpen) {
          nav.classList.toggle("open", isOpen);
          toggle.setAttribute("aria-expanded", String(!!isOpen));
        }

        toggle.addEventListener("click", function (e) {
          e.stopPropagation();
          setOpen(!nav.classList.contains("open"));
        });

        nav.addEventListener("click", function (e) {
          if (e.target.tagName === "A") setOpen(false);
        });

        document.addEventListener("click", function (e) {
          if (!nav.classList.contains("open")) return;
          if (!nav.contains(e.target) && !toggle.contains(e.target))
            setOpen(false);
        });

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") setOpen(false);
        });
      })();

      function getQueryValue(name) {
        return new URLSearchParams(window.location.search).get(name);
      }

      const itemId = getQueryValue("id");
      const imageOverride = getQueryValue("image");

      const STORAGE_USER = "tinythreadsUser";
      const STORAGE_CART = "tinythreadsCartByUser";
      const STORAGE_FAVORITES = "tinythreadsFavoritesByUser";
      const STORAGE_USERS = "tinythreadsUsers";

      let currentUser = JSON.parse(
        localStorage.getItem(STORAGE_USER) || "null",
      );
      let cartMap = JSON.parse(localStorage.getItem(STORAGE_CART) || "{}");
      let favoriteMap = JSON.parse(
        localStorage.getItem(STORAGE_FAVORITES) || "{}",
      );
      let cart = currentUser ? cartMap[currentUser.email] || {} : {};
      let favorites = currentUser ? favoriteMap[currentUser.email] || {} : {};
      let users = JSON.parse(localStorage.getItem(STORAGE_USERS) || "{}");

      function saveState() {
        if (currentUser) {
          cartMap[currentUser.email] = cart;
          favoriteMap[currentUser.email] = favorites;
        }
        localStorage.setItem(STORAGE_USER, JSON.stringify(currentUser));
        localStorage.setItem(STORAGE_CART, JSON.stringify(cartMap));
        localStorage.setItem(STORAGE_FAVORITES, JSON.stringify(favoriteMap));
        localStorage.setItem(STORAGE_USERS, JSON.stringify(users));
        updateCartCount();
        updateFavoriteCount();
        refreshCartButton();
        if (
          !document.getElementById("cartOverlay").classList.contains("hidden")
        ) {
          renderCart();
        }
      }

      function formatMoney(value) {
        return "$" + Number(value).toFixed(2);
      }

      function updateCartCount() {
        const total = Object.keys(cart).length;
        const el = document.getElementById("cartCount");
        if (el) {
          el.textContent = total;
          el.style.display = total ? "inline-flex" : "none";
        }
      }

      function updateFavoriteCount() {
        const total = Object.keys(favorites).length;
        const el = document.getElementById("favoriteCount");
        if (el) {
          el.textContent = total;
          el.style.display = total ? "inline-flex" : "none";
        }
      }

      function refreshCartButton() {
        const btn = document.getElementById("addToCartButton");
        if (!btn) return;
        if (currentUser && item && cart[item.name]) {
          btn.textContent = "Added";
          btn.disabled = true;
        } else {
          btn.textContent = "Add to Cart";
          btn.disabled = false;
        }
      }

      // ── Navbar: cart, favorites, auth ──────────────────────────────────────
      (function () {
        const cartButton = document.getElementById("cartButton");
        const favoriteButton = document.getElementById("favoriteButton");
        const cartOverlay = document.getElementById("cartOverlay");
        const favoritesOverlay = document.getElementById("favoritesOverlay");
        const cartBackdrop = document.getElementById("cartBackdrop");
        const favoritesBackdrop = document.getElementById("favoritesBackdrop");
        const closeCart = document.getElementById("closeCart");
        const closeFavorites = document.getElementById("closeFavorites");
        const cartItems = document.getElementById("cartItems");
        const favoritesItems = document.getElementById("favoritesItems");
        const cartFooter = document.getElementById("cartFooter");
        const cartTotal = document.getElementById("cartTotal");
        const checkoutButton = document.getElementById("checkoutButton");
        const deleteAllButton = document.getElementById("deleteAllButton");
        const authButton = document.getElementById("authButton");
        const authMenu = document.getElementById("authMenu");
        const authChevron = document.getElementById("authChevron");
        const logoutNavButton = document.getElementById("logoutNavButton");
        const authLabel = document.getElementById("authLabel");

        function renderCart() {
          const entries = Object.values(cart);
          cartItems.innerHTML = "";
          if (!entries.length) {
            cartItems.innerHTML =
              '<p class="empty-cart">Your cart is empty. Add something fun!</p>';
            cartFooter.classList.add("hidden");
            return;
          }
          let total = 0;
          entries.forEach((i) => {
            total += i.price * i.quantity;
            const row = document.createElement("div");
            row.className = "cart-row";
            row.innerHTML = `
                        <div>
                            <strong>${i.name}</strong>
                            <p>${i.quantity} × ${formatMoney(i.price)}</p>
                        </div>
                        <div class="cart-row-actions">
                            <button type="button" class="btn btn-outline cart-decrease" data-item="${i.name}" aria-label="Decrease quantity">
                                <i class="bi bi-dash-lg" aria-hidden="true"></i>
                            </button>
                            <span>${i.quantity}</span>
                            <button type="button" class="btn btn-outline cart-increase" data-item="${i.name}" aria-label="Increase quantity">
                                <i class="bi bi-plus-lg" aria-hidden="true"></i>
                            </button>
                            <button type="button" class="btn btn-outline cart-delete" data-item="${i.name}" aria-label="Remove item">
                                <i class="bi bi-trash3" aria-hidden="true"></i>
                            </button>
                        </div>`;
            cartItems.appendChild(row);
          });
          cartTotal.textContent = formatMoney(total);
          cartFooter.classList.remove("hidden");
          cartItems
            .querySelectorAll(".cart-decrease")
            .forEach((b) =>
              b.addEventListener("click", () => adjustQty(b.dataset.item, -1)),
            );
          cartItems
            .querySelectorAll(".cart-increase")
            .forEach((b) =>
              b.addEventListener("click", () => adjustQty(b.dataset.item, 1)),
            );
          cartItems
            .querySelectorAll(".cart-delete")
            .forEach((b) =>
              b.addEventListener("click", () => removeItem(b.dataset.item)),
            );
        }

        function renderFavorites() {
          const entries = Object.values(favorites);
          favoritesItems.innerHTML = "";
          if (!entries.length) {
            favoritesItems.innerHTML =
              '<p class="empty-cart">No favorites yet. Save an item you love.</p>';
            return;
          }
          entries.forEach((i) => {
            const row = document.createElement("div");
            row.className = "favorite-row";
            row.innerHTML = `
                        <div>
                            <strong>${i.name}</strong>
                            <p>${formatMoney(i.price)}</p>
                        </div>
                        <button type="button" class="btn btn-outline favorite-remove" data-item="${i.name}" aria-label="Remove favorite">
                            <i class="bi bi-heart-fill" aria-hidden="true"></i>
                        </button>`;
            favoritesItems.appendChild(row);
          });
          favoritesItems.querySelectorAll(".favorite-remove").forEach((b) =>
            b.addEventListener("click", () => {
              if (!favorites[b.dataset.item]) return;
              delete favorites[b.dataset.item];
              saveState();
              updateFavoriteCount();
              renderFavorites();
              const favBtn = document.getElementById("favoriteDetailButton");
              if (favBtn && item && b.dataset.item === item.name) {
                favBtn.textContent = "Save to Favorites";
              }
            }),
          );
        }

        function adjustQty(name, delta) {
          if (!cart[name]) return;
          cart[name].quantity += delta;
          if (cart[name].quantity < 1) delete cart[name];
          saveState();
          updateCartCount();
          renderCart();
          refreshCartButton();
        }

        function removeItem(name) {
          if (!cart[name]) return;
          delete cart[name];
          saveState();
          updateCartCount();
          renderCart();
          refreshCartButton();
        }

        function openCart() {
          renderCart();
          cartOverlay.classList.remove("hidden");
          cartOverlay.classList.add("show");
        }
        function closeCartOverlay() {
          cartOverlay.classList.add("hidden");
          cartOverlay.classList.remove("show");
        }
        function openFavorites() {
          renderFavorites();
          favoritesOverlay.classList.remove("hidden");
          favoritesOverlay.classList.add("show");
        }
        function closeFavoritesOverlay() {
          favoritesOverlay.classList.add("hidden");
          favoritesOverlay.classList.remove("show");
        }

        function closeAuthMenu() {
          authMenu.classList.add("hidden");
          authButton.setAttribute("aria-expanded", "false");
        }

        function updateAuthNav() {
          if (currentUser) {
            const userName =
              currentUser.name || currentUser.email.split("@")[0];
            authLabel.textContent = `Welcome, ${userName}`;
            authButton.setAttribute(
              "aria-label",
              `Account menu for ${userName}`,
            );
            authChevron.classList.remove("hidden");
          } else {
            authLabel.textContent = "Login";
            authButton.setAttribute("aria-label", "Sign in");
            authChevron.classList.add("hidden");
            closeAuthMenu();
          }
          updateCartCount();
          updateFavoriteCount();
          refreshCartButton();
          renderFavorites();
        }

        authButton.addEventListener("click", (event) => {
          event.stopPropagation();
          if (!currentUser) {
            window.location.href = "login.html";
            return;
          }
          authMenu.classList.toggle("hidden");
          authButton.setAttribute(
            "aria-expanded",
            authMenu.classList.contains("hidden") ? "false" : "true",
          );
        });

        logoutNavButton.addEventListener("click", () => {
          if (currentUser) {
            cartMap[currentUser.email] = cart;
            favoriteMap[currentUser.email] = favorites;
          }
          currentUser = null;
          cart = {};
          favorites = {};
          saveState();
          updateAuthNav();
          updateCartCount();
          updateFavoriteCount();
          closeAuthMenu();
          closeFavoritesOverlay();
          window.location.href = "login.html";
        });

        document.addEventListener("click", function (event) {
          if (
            currentUser &&
            !authMenu.classList.contains("hidden") &&
            !event.target.closest(".auth-dropdown")
          ) {
            closeAuthMenu();
          }
        });

        cartButton.addEventListener("click", () => {
          if (cartOverlay.classList.contains("show")) {
            closeCartOverlay();
          } else {
            openCart();
          }
        });

        favoriteButton.addEventListener("click", () => {
          if (!currentUser) {
            window.location.href = "login.html";
            return;
          }
          if (favoritesOverlay.classList.contains("show")) {
            closeFavoritesOverlay();
          } else {
            openFavorites();
          }
        });

        closeCart.addEventListener("click", closeCartOverlay);
        closeFavorites.addEventListener("click", closeFavoritesOverlay);
        cartBackdrop.addEventListener("click", closeCartOverlay);
        favoritesBackdrop.addEventListener("click", closeFavoritesOverlay);
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            closeCartOverlay();
            closeFavoritesOverlay();
          }
        });

        checkoutButton.addEventListener("click", () => {
          if (!Object.keys(cart).length) return;
          cart = {};
          saveState();
          updateCartCount();
          renderCart();
          closeCartOverlay();
          refreshCartButton();
        });

        deleteAllButton.addEventListener("click", () => {
          if (!Object.keys(cart).length) return;
          cart = {};
          saveState();
          updateCartCount();
          renderCart();
          refreshCartButton();
        });

        window.addEventListener("storage", function (event) {
          if (
            ![
              "tinythreadsCartByUser",
              "tinythreadsFavoritesByUser",
              "tinythreadsUser",
            ].includes(event.key)
          )
            return;
          currentUser = JSON.parse(
            localStorage.getItem(STORAGE_USER) || "null",
          );
          cartMap = JSON.parse(localStorage.getItem(STORAGE_CART) || "{}");
          favoriteMap = JSON.parse(
            localStorage.getItem(STORAGE_FAVORITES) || "{}",
          );
          cart = currentUser ? cartMap[currentUser.email] || {} : {};
          favorites = currentUser ? favoriteMap[currentUser.email] || {} : {};
          updateCartCount();
          updateFavoriteCount();
          refreshCartButton();
          updateAuthNav();
          if (cartOverlay && cartOverlay.classList.contains("show")) {
            renderCart();
          }
        });

        updateCartCount();
        updateFavoriteCount();
        updateAuthNav();
      })();

      // ── Detail page rendering ───────────────────────────────────────────────
      function renderNotFound() {
        detailContent.innerHTML = `
                <div class="section-intro">
                    <h3 class="section-title">Item not found</h3>
                    <p>We couldn't find that item. Please return to collections and choose another product.</p>
                    <div class="section-footer">
                        <a href="collections.html" class="btn btn-primary">Back to collections</a>
                        <a href="index.html" class="btn btn-outline">Home</a>
                    </div>
                </div>`;
      }

      function getFieldLabel(key) {
        const labels = {
          sizes: "Choose size",
          colors: "Choose color",
          ages: "Suggested age",
          heights: "Choose height",
          weights: "Choose weight",
        };
        return labels[key] || key;
      }

      function getSummaryLabel(key) {
        const labels = {
          sizes: "Available sizes",
          colors: "Available colors",
          ages: "Suggested ages",
          heights: "Height options",
          weights: "Weight options",
        };
        return labels[key] || key;
      }

      function getFieldOrder(item) {
        const fieldMap = {
          Shoes: ["sizes"],
          Jackets: ["sizes", "ages", "heights", "weights"],
          Jeans: ["sizes", "ages", "heights", "weights"],
          Playwear: ["sizes", "ages", "heights", "weights"],
        };
        return (
          fieldMap[item.category] || ["sizes", "ages", "heights", "weights"]
        ).filter((key) => Array.isArray(item[key]) && item[key].length);
      }

      function renderDetail() {
        const fieldOrder = getFieldOrder(item);
        const summaryHtml = fieldOrder
          .map(
            (key) =>
              `<div><strong>${getSummaryLabel(key)}:</strong> ${item[key].join(", ")}</div>`,
          )
          .join("");
        const fieldSelectors = fieldOrder
          .map((key) => {
            const options = item[key]
              .map((value) => `<option value="${value}">${value}</option>`)
              .join("");
            return `
                    <div class="detail-meta">
                        <label for="${key}Select">${getFieldLabel(key)}</label>
                        <select id="${key}Select" data-attr="${key}">${options}</select>
                    </div>`;
          })
          .join("");

        const detailImageSrc = imageOverride || item.image;
        detailContent.innerHTML = `
                <div class="detail-hero">
                    <div class="detail-image">
                        <img src="${detailImageSrc}" alt="${item.name}">
                    </div>
                    <div class="detail-panel">
                        <span class="eyebrow">${item.category}</span>
                        <h1>${item.name}</h1>
                        <p>${item.description}</p>
                        <div class="detail-meta">
                            <div><strong>Price:</strong> ${formatMoney(item.price)}</div>
                            <div><strong>Category:</strong> ${item.category}</div>
                        </div>
                        <div class="detail-meta">${summaryHtml}</div>
                        ${fieldSelectors}
                        <div class="detail-actions">
                            <button id="addToCartButton" class="btn btn-primary" type="button">Add to Cart</button>
                            <button id="favoriteDetailButton" class="btn btn-outline" type="button">Save to Favorites</button>
                        </div>
                        <div id="detailMessage" class="small" style="margin-top:12px;color:#334155"></div>
                        <div class="section-footer">
                            <a href="collections.html" class="btn btn-outline">Back to collections</a>
                            <a href="index.html" class="btn btn-primary">Home</a>
                        </div>
                    </div>
                </div>`;

        const addToCartButton = document.getElementById("addToCartButton");
        const favoriteDetailButton = document.getElementById(
          "favoriteDetailButton",
        );
        const message = document.getElementById("detailMessage");

        function refreshMessage(text) {
          message.textContent = text;
        }

        refreshCartButton();

        addToCartButton.addEventListener("click", function () {
          if (!currentUser) {
            window.location.href = "login.html";
            return;
          }
          const selects = Array.from(
            document.querySelectorAll("select[data-attr]"),
          );
          const selections = selects.reduce((acc, select) => {
            acc[select.dataset.attr] = select.value;
            return acc;
          }, {});
          const cartKey = item.name;
          if (cart[cartKey]) {
            cart[cartKey] = { ...cart[cartKey], ...selections };
          } else {
            cart[cartKey] = {
              name: item.name,
              price: item.price,
              quantity: 1,
              ...selections,
            };
          }
          saveState();
          refreshCartButton();
          refreshMessage("Added to cart with selected options.");
        });

        favoriteDetailButton.addEventListener("click", function () {
          if (!currentUser) {
            window.location.href = "login.html";
            return;
          }
          if (favorites[item.name]) {
            delete favorites[item.name];
            favoriteDetailButton.textContent = "Save to Favorites";
            refreshMessage("Removed from favorites.");
          } else {
            favorites[item.name] = { name: item.name, price: item.price };
            favoriteDetailButton.textContent = "Saved";
            refreshMessage("Saved to favorites.");
          }
          saveState();
          updateFavoriteCount();
        });

        if (currentUser && favorites[item.name]) {
          favoriteDetailButton.textContent = "Saved";
        }
      }

      if (!item) {
        renderNotFound();
      } else {
        renderDetail();
      }
    </script>
  </body>
</html>
