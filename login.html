<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyThreads | Login</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <h1 class="brand"><a href="index.html">TinyThreads</a></h1>
            <button class="nav-toggle" aria-controls="site-nav" aria-expanded="false" aria-label="Toggle menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
            <nav id="site-nav" class="nav" role="navigation">
                <a href="index.html#showcase">Showcase</a>
                <a href="index.html#collection">Collection</a>
                <a href="index.html#categories">Categories</a>
                <a href="index.html#testimonials">Reviews</a>
                <a href="index.html#contact" class="cta">Shop</a>
                <div class="nav-actions">
                    <button id="cartButton" class="icon-btn" type="button" aria-label="Open cart">
                        <i class="bi bi-cart3 icon" aria-hidden="true"></i>
                        <span class="badge" id="cartCount">0</span>
                    </button>
                    <button id="favoriteButton" class="icon-btn" type="button" aria-label="Open favorites">
                        <i class="bi bi-heart icon" aria-hidden="true"></i>
                        <span class="badge" id="favoriteCount">0</span>
                    </button>
                    <div class="auth-dropdown">
                        <button id="authButton" class="icon-btn" type="button" aria-label="Sign in" aria-haspopup="true" aria-expanded="false">
                            <span id="authLabel">Login</span>
                            <i class="bi bi-chevron-down dropdown-arrow hidden" id="authChevron" aria-hidden="true"></i>
                        </button>
                        <div id="authMenu" class="auth-menu hidden">
                            <button type="button" id="logoutNavButton" class="auth-menu-item">Logout</button>
                        </div>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <section class="container section auth-page">
            <div class="auth-card">
                <div class="auth-header">
                    <div>
                        <span class="eyebrow">Members only</span>
                        <h3 id="authHeading">Login to your account</h3>
                        <p id="authDescription">Use your email and password to sign in, or create an account to start shopping.</p>
                    </div>
                </div>
                <form id="authForm" class="auth-form" novalidate>
                    <label>
                        <span>Email</span>
                        <input id="authEmail" type="email" name="email" required
                            pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$"
                            placeholder="you@example.com">
                    </label>
                    <label>
                        <span>Password</span>
                        <input id="authPassword" type="password" name="password" required
                            pattern=".{8,}"
                            title="Password must be at least 8 characters"
                            placeholder="At least 8 characters">
                    </label>
                    <label id="confirmPasswordLabel" class="hidden">
                        <span>Confirm Password</span>
                        <input id="authConfirmPassword" type="password" name="confirmPassword"
                            pattern=".{8,}"
                            title="Passwords must match"
                            placeholder="Repeat your password">
                    </label>
                    <div class="form-actions">
                        <button class="btn btn-primary" type="submit" id="authSubmit">Login</button>
                    </div>
                    <p class="form-message hidden" id="authMessage"></p>
                    <div class="auth-footer">
                        <p id="authPrompt">Don't have an account?</p>
                        <button id="switchModeButton" class="auth-link" type="button">Sign up</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p>&copy; 2026 TinyThreads. Little outfits, big smiles.</p>
            <nav class="footer-nav">
                <a href="index.html#privacy">Privacy</a>
                <a href="index.html#terms">Terms</a>
            </nav>
        </div>
    </footer>

        <script src="assets/js/common.js"></script>
    <script src="assets/js/login.js"></script>
</body>
</html>
